<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>love</title>
<link rel="icon" type="image/png" href="web/favicon.png">
<link rel="stylesheet" href="web/style.css">
<!-- the machine's shared ring wants an isolated page, and a static host sends no headers:
     this asks for them with a service worker and one reload. first, so the reload is
     cheap; inert where the server sends them itself (kiosko does). -->
<script src="inle/wasm/coi.js"></script>
</head>
<body class="full">

<!-- the machine island: the markup inle/wasm/machine.js drives, its parts found by
     class, and here the whole page -- the canvas is the screen. a page carries this block
     and machine.js (a module), and coi.js in the head -- that one goes first because it
     may reload the page to put the isolation headers on. the boot line and the two
     artifacts ride data- attributes, so a page can aim it elsewhere (data-wasm,
     data-image, data-boot, data-ram, data-cols, data-ratio); the defaults are web/wasm/,
     which is where `make site-wasm` puts them, and a query string names the same and
     wins where it does. the canvas carries no size: its box is the stylesheet's and its
     pixels are that box's own, measured at boot and again on a reflow. -->
<div class="machine">
<p class="status">waking the machine...</p>
<canvas class="fb" tabindex="0"></canvas>
</div>

<script type="module" src="inle/wasm/machine.js"></script>
</body>
</html>
