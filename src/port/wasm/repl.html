<!-- src/port/wasm/repl.html -- the repl island: the markup src/port/wasm/repl.js drives,
     its parts found by class. a page carries this block, then cells.js and repl.js (a module):
     web/index.l lays it on the front page, papel on the index of a site built with -r. -->
<div class="repl">
<p class="status">loading the image...</p>

<div class="term">
  <button class="clear" title="clear the session">clear</button>
  <div class="scroll">
    <div class="out"></div>
    <div class="row"><textarea class="cmd" rows="1" spellcheck="false" autocomplete="off" disabled></textarea></div>
  </div>
</div>
<!-- the app screen: quay's tty apps repaint one full-screen ANSI frame per
     step; the driver (src/port/wasm/repl.js) parses that frame (CSI H/K + 256-color SGR) into a
     cell grid. hidden until an app launches; q/esc steps back to the repl. -->
<div class="app" hidden tabindex="0">
  <pre class="screen"></pre>
  <div class="appbar"><span class="appname"></span><span class="apphint"></span></div>
</div>
<span class="chip" data-run='."hello world :3\n"'>hello world</span>
<span class="chip" data-run='15 (\ n (.((n % 3 ? () "fizz") + (n % 5 ? () "buzz") || n), ."\n", n + 1)) 1'>fizzbuzz</span>
<span class="chip" data-run="1 2 3 4">1 2 3 4</span>
<span class="chip" data-run="map (net * jot * (+ 2)) $ jot (3 3)">map (net * jot * (+ 2)) $ jot (3 3)</span>
<span class="chip" data-run="(1 / 2) 2">(1 / 2) 2</span>
<span class="chip" data-run="(1 / 2) -1">(1 / 2) -1</span>
<span class="chip" data-run="(i * pi) e">(i * pi) e</span>
<span data-app="ink" style="display:none" class="chip">ink (screensaver demo)</span>
<span data-app="rove" style="display:none" class="chip">rove (roguelike demo)</span>
<span data-app="lighthouse" style="display:none" class="chip">lighthouse (a story)</span>
</div>
