<!doctype html>
<!-- i/wasm/inle.html -- love.wasm as a machine in the page: the kernel runs in a
     worker (cpu.mjs), the canvas is its framebuffer, the keyboard its serial line, and
     an AudioWorklet (horn.js) its speaker -- which starts at the first click, a page
     having no say in that. serve
     the tree root (`make serve`) and open /i/wasm/inle.html; the module is read from
     b/love.wasm, so `make b/love.wasm` first. coi.js makes the page
     cross-origin isolated on a static host, which SharedArrayBuffer wants.
     ?boot= is the boot line, ?ram= the RAM in MiB, ?cols= the most columns the
     console should have -- which is what settles how large a glyph is drawn.
     the machine takes its RAM at boot and never gives it back, so the default is a
     tower's and not a shell's: at 256 the walk answers a keypress in twenty-odd SECONDS
     and the floor is somewhere under 512, while `love seed` wants the same 1024 and ooms
     under 768 -- so one number covers both. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>inle</title>
<script src="coi.js"></script>
<style>
  html, body { margin: 0; background: #111; color: #ccc; font: 14px/1.4 monospace; }
  main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  /* the console takes the box and settles its own rows and columns inside it, so the
     size here is a page layout and nothing else -- no aspect ratio to keep. */
  canvas { image-rendering: pixelated; display: block; outline: none; background: #000;
           width: min(100%, 1280px); height: min(78vh, 880px); }
  .hint { color: #666; }
</style>
</head>
<body>
<main>
  <canvas id="fb" tabindex="0"></canvas>
  <div class="hint">click the screen, then type. the boot line: <code id="boot"></code></div>
  <div class="hint">to carry a file out of the machine, aboard: <code>lift FILE</code> -- it arrives as a download <span id="lifted"></span></div>
  <p id="note" class="hint"></p>
</main>
<script type="module">
  import { ctl_n, ring_n, ring_at, lift_n, lift_at, shared_n, scan_at, scan_n, c_sh, c_st } from './cpu.mjs';
  import { scanning } from './scan.mjs';
  import { glass } from './glass.mjs';
  import { hearing } from './hear.mjs';
  const $ = (id) => document.getElementById(id);
  const note = $('note'), canvas = $('fb');
  // ONE CONSOLE DOOR: the canvas is it -- the worker is handed the framebuffer and quay
  // paints the guest's own terminal into it, cursor motion and erases obeyed. this side
  // says only what the canvas cannot: the machine failing to start, or stopping.
  const say = (s) => { note.textContent = s; };
  if (!window.crossOriginIsolated) { say('not cross-origin isolated: SharedArrayBuffer is unavailable, reloading under coi.js..\n'); }
  else {
    const q = new URLSearchParams(location.search);
    const cmd = q.get('boot') ?? 'sh';
    $('boot').textContent = cmd || '(the console shell)';
    const ring = new SharedArrayBuffer(shared_n);
    const ctl = new Int32Array(ring, 0, ctl_n), kb = new Uint8Array(ring, ring_at, ring_n);
    // the way out is the machine's own: `lift FILE` aboard writes /proc/lift, the worker
    // reads the file off the ramfs at its next idle, and the bytes come back below
    const push = (bytes) => {
      let tail = Atomics.load(ctl, 1);
      for (const b of bytes) { const n = (tail + 1) % ring_n; if (n === Atomics.load(ctl, 0)) break; kb[tail] = b; tail = n; }
      Atomics.store(ctl, 1, tail); Atomics.add(ctl, 2, 1); Atomics.notify(ctl, 2); };
    // a key as the bytes a serial terminal sends: CR for Enter, DEL for Backspace, ESC
    // sequences for the arrows and home/end, the control letters as themselves
    const keys = { Enter: [13], Backspace: [127], Tab: [9], Escape: [27], Delete: [27, 91, 51, 126],
                   ArrowUp: [27, 91, 65], ArrowDown: [27, 91, 66], ArrowRight: [27, 91, 67], ArrowLeft: [27, 91, 68],
                   Home: [27, 91, 72], End: [27, 91, 70], PageUp: [27, 91, 53, 126], PageDown: [27, 91, 54, 126] };
    canvas.addEventListener('keydown', (e) => {
      let b = keys[e.key];
      if (!b && e.key.length === 1) {
        const c = e.key.codePointAt(0);
        b = e.ctrlKey && c >= 64 && c < 128 ? [c & 31] : e.ctrlKey || e.metaKey || e.altKey ? null : [...new TextEncoder().encode(e.key)]; }
      if (!b) return;
      e.preventDefault(); push(b); });
    // SOUND: the samples come out of the shared ring and hear.mjs's worklet plays them,
    // from the first touch of the screen, which is the earliest a page is allowed to
    const hear = hearing(ring, ctl, say);
    canvas.addEventListener('pointerdown', hear);
    canvas.addEventListener('keydown', hear);
    scanning(ring, ctl, canvas, { scan_at, scan_n, c_sh, c_st });   // and as scancodes, for a game
    // the canvas stays on THIS thread and the worker sends frames (cpu.mjs's blit): a
    // transferred canvas only reaches its placeholder at a task checkpoint, and the worker
    // never has one -- its idle is an Atomics.wait inside the boot's own task.
    const ctx = canvas.getContext('2d');
    const cpu = new Worker(new URL('./cpu.mjs', import.meta.url), { type: 'module' });
    // only the NEWEST frame is worth drawing: the worker posts as it paints and never
    // waits to be told the page kept up, so drawing them in order would queue, and a queue
    // here is latency the reader reads as a machine that answers late. the latch holds one
    // and the display's own clock takes it -- what is late is dropped, not shown.
    let latest = null, due = 0;
    const draw = () => {
      due = 0;
      const m = latest;
      latest = null;
      if (!m) return;
      // the backing store follows the FRAME and not the measurement: the machine may
      // refuse a size, and resizing the canvas clears it, so only on a real change
      if (canvas.width !== m.w || canvas.height !== m.h) canvas.width = m.w, canvas.height = m.h;
      ctx.putImageData(new ImageData(new Uint8ClampedArray(m.frame), m.w, m.h), 0, 0); };
    cpu.onmessage = ({ data: m }) => {
      if (m.frame) { latest = m; if (!due) due = requestAnimationFrame(draw); }
      else if (m.lift !== undefined) {
        if (m.error) { $('lifted').textContent = `${m.lift}: errno ${m.error}`; return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([m.bytes])); a.download = m.lift.split('/').pop();
        a.textContent = `${a.download} (${m.bytes.length} bytes)`;
        $('lifted').replaceChildren(a); a.click(); }
      else if (m.fault) say('the machine faulted: ' + m.fault); };
    cpu.onerror = (e) => say('the machine stopped: ' + e.message);
    const wasm = await (await fetch(new URL('../../b/love.wasm', import.meta.url))).arrayBuffer();
    // the heap image beside the module (`make wasm` bakes it): a wake is a moment where the
    // egg boot is many seconds. absent, the kernel bakes the egg.
    const image = await fetch(new URL('../../b/wasm/love.image', import.meta.url))
      .then((r) => r.ok ? r.arrayBuffer() : null).catch(() => null);
    // the canvas measured as real pixels, and the zoom a glyph pixel gets there; ?cols
    // is the most columns worth reading, which is what picks the zoom
    const cols = Number(q.get('cols') ?? 80);
    const fb = { ...glass(canvas, cols), post: true };
    cpu.postMessage({ wasm, ring, ram: Number(q.get('ram') ?? 1024), cmd, fb, image },
                    image ? [wasm, image] : [wasm]);
    // the window resized: the new size goes into the ring and the kernel re-makes its
    // console at it. debounced, a drag being hundreds of reflows and each one a new grid.
    let pending = 0;
    const ask = () => {
      const box = canvas.getBoundingClientRect();
      if (box.width < 1 || box.height < 1) return;
      const g = glass(canvas, cols);
      Atomics.store(ctl, 5, g.w); Atomics.store(ctl, 6, g.h); Atomics.store(ctl, 7, g.scale);
      Atomics.store(ctl, 4, 1);
      Atomics.add(ctl, 2, 1); Atomics.notify(ctl, 2); };
    new ResizeObserver(() => { clearTimeout(pending); pending = setTimeout(ask, 150); }).observe(canvas);
    canvas.focus(); }
</script>
</body>
</html>
